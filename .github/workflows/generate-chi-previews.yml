name: Validate portfolio Works build
on:
  push:
    branches:
      - feat/long-form-categories-and-media-tools
    paths:
      - .github/workflows/generate-chi-previews.yml
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Install and build Astro site
        run: |
          node --version
          npm ci --no-audit --no-fund
          npm run check
          npm run build
