name: Validate Works thumbnail gallery
on:
  push:
    branches: [feat/works-thumbnail-gallery-editor]
    paths: [.github/workflows/validate-thumbnail-gallery.yml]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Validate references and ownership-safe catalog
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          clips = json.loads(Path('src/data/clips.json').read_text())['clips']
          thumbs = json.loads(Path('src/data/thumbnails.json').read_text())
          by_id = {c['id']: c for c in clips}
          assert len(clips) == 51, len(clips)
          assert len(thumbs) == 12, len(thumbs)
          assert len({t['id'] for t in thumbs}) == 12
          assert {t['image'].removeprefix('clip:') for t in thumbs} == {c['id'] for c in clips if c['orientation'] == 'landscape'} | {'chi-c6'}
          for t in thumbs:
              ref = t['image'].removeprefix('clip:')
              assert ref in by_id
              assert t['videoUrl'] == by_id[ref]['youtubeUrl']
              assert t['orientation'] == by_id[ref]['orientation']
          assert not (set(by_id) & {'miu-ms25','miu-mv1','miu-mv40','pidge-p6'})
          print('Verified all 12 gallery items are linked to existing source posters')
          PY
      - name: Typecheck and build Astro
        run: |
          npm ci --no-audit --no-fund
          npm run check
          npm run build
