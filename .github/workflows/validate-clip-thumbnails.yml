name: Validate updated portfolio clips and thumbnails
on:
  push:
    branches: [feat/miu-videos-and-clip-thumbnail-editor]
    paths: [.github/workflows/validate-clip-thumbnails.yml]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Validate catalog and real poster files
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          clips=json.loads(Path('src/data/clips.json').read_text())['clips']
          ids=[c['id'] for c in clips]
          assert len(clips)==51, (len(clips), ids[:4])
          assert len(ids)==len(set(ids))
          assert not (set(ids)&{'miu-ms25','miu-mv1','miu-mv40','pidge-p6'})
          for name in ['chi-c5','chi-c6','miu-mv42','miu-mv43']:
              assert Path(f'src/assets/posters/{name}.webp').is_file(), name
          assert next(c for c in clips if c['id']=='miu-mv42')['longFormCategory']=='normal'
          assert next(c for c in clips if c['id']=='miu-mv43')['longFormCategory']=='vlogs'
          print('Verified 51 clips and four WebP posters')
          PY
      - name: Typecheck and build Astro
        run: |
          npm ci --no-audit --no-fund
          npm run check
          npm run build
